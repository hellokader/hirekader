    // document mints the blobs for its OWN frames, obtaining page text

    const blobUrls = {};
    const resourceBlobs = {};

      delete pendingFrames[uuid];

      // root's never-relay rule) are what hold in fully opaque chains

      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

    // consumers read these Blobs directly. Survives the swap like the error sink.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

7px;line-height:1.6;-webkit-font-smoothing:antialiased}\na{color:inherit;text-decoration:none}\na:hover{color:var(--accent)}\nimg{display:block;max-width:100%}\n.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}\nh1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}\n.mono{font-family:var(--mono)}\n.ph{position:relative;background:repeating-linear-gradient(135deg,#eee7d9 0 11px,#f4efe3 11px 22px);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;font-family:var(--sans);font-weight:600;font-size:15px;padding:13px 24px;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,transform .15s}\n.btn-accent{background:var(--accent);color:#fff}\n.btn-accent:hover{background:var(--accent-dark);color:#fff;transform:translateY(-1px)}\n.btn-outline{background:transparent;color:var(--ink);border-color:var(--border)}\n.btn-outline:hover{border-color:var(--ink);color:var(--ink)}\n.btn-block{width:100%}\nsection{padding:88px 0}\n/* band shades: all derived from brand #0A66C2 */\n.b-base{background:var(--bg-base)}\n.b-tint1{background:var(--bg-tint-1)}\n.b-tint2{background:var(--bg-tint-2)}\n.b-tint2 .head p,.b-tint2 .chip,.b-tint2 .trust .lbl,.b-tint2 p{color:var(--muted-tint2)}\n.b-brand{background:var(--bg-brand);color:#fff}\n.b-deep{background:var(--bg-deep);color:#fff}\n.b-deep .eyebrow,.b-brand .eyebrow{color:rgba(255,255,255,.72)}\n.b-deep .eyebrow::before,.b-brand .eyebrow::before{background:rgba(255,255,255,.72)}\n.b-deep .head p{color:rgba(255,255,255,.72)}\n.b-deep .btn-outline{color:#fff;border-color:rgba(255,255,255,.35)}\n.b-deep .btn-outline:hover{border-color:#fff;color:#fff}\n.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}\n.eyebrow::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--accent)}\n.head{max-width:640px;margin-bottom:40px}\n.head h2{font-size:32px;font-weight:700;margin:0 0 12px;text-wrap:balance}\n.head p{color:var(--muted);font-size:16.5px;margin:0}\n\n/* NAV */\n.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}\n.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px}\n.wordmark{display:flex;align-items:center}\n.wordmark img{height:34px;width:auto}\n.foot-logo{height:38px;width:auto;margin:0 0 16px}\n.navmenu{display:flex;align-items:center;gap:30px;margin:0 auto}\n.navmenu a{position:relative;color:var(--muted);font-weight:500;font-size:15px;padding:8px 0;transition:color .15s}\n.navmenu a::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--accent);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .22s ease}\n.navmenu a:hover,.navmenu a.active{color:var(--accent);font-weight:600}\n.navmenu a:hover::after,.navmenu a.active::after{transform:scaleX(1)}\n@media (prefers-reduced-motion:reduce){.navmenu a::after{transition:none}}\n.nav-right{display:flex;align-items:center;gap:10px}\n.hamburger{display:none;width:40px;height:40px;flex-direction:column;justify-content:center;gap:5px;background:transparent;border:none;cursor:pointer}\n.hamburger span{display:block;width:20px;height:2px;margin:0 auto;background:var(--ink);border-radius:2px}\n.overlay{position:fixed;inset:0;background:rgba(18,24,31,.45);opacity:0;visibility:hidden;transition:opacity .25s;z-index:60}\n.overlay.open{opacity:1;visibility:visible}\n.drawer{position:fixed;top:0;right:0;height:100%;width:78%;max-width:320px;background:var(--surface);box-shadow:-10px 0 34px rgba(18,24,31,.18);transform:translateX(100%);transitio >Storm work and full replacements.<\u002Fp><\u002Farticle>\n<article class=\"ind-card\"><div class=\"ind-ico\"><i data-lucide=\"zap\"><\u002Fi><\u002Fdiv><h3>Electrical<\u002Fh3><p>Callouts, panels and rewires.<\u002Fp><\u002Farticle>\n<article class=\"ind-card\"><div class=\"ind-ico\"><i data-lucide=\"bug\"><\u002Fi><\u002Fdiv><h3>Pest control<\u002Fh3><p>One-off treatments and contracts.<\u002Fp><\u002Farticle>\n<article class=\"ind-card\"><div class=\"ind-ico\"><i data-lucide=\"spray-can\"><\u002Fi><\u002Fdiv><h3>Cleaning<\u002Fh3><p>Residential and commercial routes.<\u002Fp><\u002Farticle>\n<article class=\"ind-card\"><div class=\"ind-ico\"><i data-lucide=\"trees\"><\u002Fi><\u002Fdiv><h3>Landscaping<\u002Fh3><p>Maintenance and design builds.<\u002Fp><\u002Farticle>\n<article class=\"ind-card\"><div class=\"ind-ico\"><i data-lucide=\"warehouse\"><\u002Fi><\u002Fdiv><h3>Garage doors<\u002Fh3><p>Repairs and same-day installs.<\u002Fp><\u002Farticle>\n<article class=\"ind-card\"><div class=\"ind-ico\"><i data-lucide=\"droplets\"><\u002Fi><\u002Fdiv><h3>Restoration<\u002Fh3><p>Water, fire and mould damage.<\u002Fp><\u002Farticle>\n<a class=\"ind-card ask\" href=\"#audit\"><div class=\"ind-ico\"><i data-lucide=\"circle-help\"><\u002Fi><\u002Fdiv><h3>Not listed?<\u002Fh3><p>Ask. If it's a home service trade, I've likely run it.<\u002Fp><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ABOUT -->\n<section id=\"about\" class=\"orbit-sec\" aria-label=\"About\">\n<div class=\"wrap\">\n<div class=\"orbit-wrap\">\n<div class=\"orbit-copy\">\n<div class=\"eyebrow\">About<\u002Fdiv>\n<h2>You run the vans. I run <em>everything<\u002Fem> that makes the phone ring.<\u002Fh2>\n<p>I help home service business owners get more qualified calls and leads from Google Ads. Campaigns, tracking and the page the click lands on, all handled by one person. You get a specialist on the account every week without paying for an agency team you never speak to.<\u002Fp>\n<p>I came into this through analytics rather than advertising, which is why I start with tracking. Once you can see which search produced which booked job, most of the hard decisions answer themselves. That habit is why I've been trusted with 150+ accounts across three countries and why I was asked to lead a team of six doing the same work at scale.<\u002Fp>\n<p>I work with a small number of clients at a time. You'll have my number, you'll get a plain-English update every week, and when something isn't working I'll tell you before you notice it on the invoice.<\u002Fp>\n<p class=\"sig\">Based in Dhaka · working US, UK &amp; Australian hours<\u002Fp>\n<div class=\"orbit-cta\">\n<a class=\"btn btn-accent\" href=\"#audit\">Start with a free audit<\u002Fa>\n<a class=\"lnk\" href=\"https://linkedin.com/in/abdul-kader-ppc\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.08 1.4-2.08 2.86V21H9z\"><\u002Fpath><\u002Fsvg>Connect on LinkedIn<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"orbit-side\">\n<div class=\"sq-frame\" id=\"sqFrame\">\n<div class=\"sq-photo\">\n<span class=\"sq-badge\"><i data-lucide=\"badge-check\"><\u002Fi>Local Search Expert<\u002Fspan>\n<image-slot id=\"about-photo-sq\" shape=\"rounded\" radius=\"16\" style=\"width:100%;height:100%\" placeholder=\"Your photo (square)\"><\u002Fimage-slot>\n<\u002Fdiv>\n<div class=\"sq-tag\">\n<div>\n<div class=\"on\">Md Abdul Kader<\u002Fdiv>\n<div class=\"om\">Google Ads · Lead gen · Tracking<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"vf\">US · UK · AU<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"sq-grid\" id=\"sqGrid\">\n<span style=\"animation-delay:.04s\"><i>Google Ads<\u002Fi><\u002Fspan>\n<span style=\"animation-delay:.09s\"><i>Local Services Ads<\u002Fi><\u002Fspan>\n<span style=\"animation-delay:.14s\"><i>Call tracking<\u002Fi><\u002Fspan>\n<span style=\"animation-delay:.19s\"><i>GA4 &amp; GTM<\u002Fi><\u002Fspan>\n<span style=\"animation-delay:.24s\"><i>Landing pages<\u002Fi><\u002Fspan>\n<span style=\"animation-delay:.29s\"><i>Wasted spend<\u002Fi><\u002Fspan>\n<span style=\"animation-delay:.34s\"><i>Business Profile<\u002Fi><\u002Fspan>\n<span style=\"animation-delay:.39s\"><i>Weekly reporting<\u002Fi><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<ul class=\"about-proof lite\">\n<li><div class=\"pk\">Reach<\u002Fdiv><div class=\"pv\">150<em>+<\u002Fem><\u002Fdiv><div class=\"pl\">local businesses helped in 2.5+ years across the US, UK and Australia<\u002Fdiv><\u002Fli>\n<li><div class=\"pk\">Cost per lead<\u002Fdiv><div class=\"pv\">$186 <em>→<\u002Fem> $74<\u002Fdiv><div class=\"pl\">for an HVAC company in 60 days. Same budget, <b>2.4× the booked calls<\u002Fb><\u002Fdiv><\u002Fli>\n<li><div class=\"pk\">Tracking rebuild<\u002Fdiv><div class=\"pv\">60<em>%<\u002Fem><\u002Fdiv><div class=\"pl\">of a pest control account's \"conversions\" were spam form fills. Real cost per lead was <b>$210, not $84<\u002Fb><\u002Fdiv><\u002Fli>\n<li><div class=\"pk\">Leadership<\u002Fdiv><div class=\"pv\">Team of <em>6<\u002Fem><\u002Fdiv><div class=\"pl\">led doing this at scale, plus agency partnerships as their specialist behind the scenes<\u002Fdiv><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROBLEM -->\n<section id=\"problem\" class=\"b-tint2\">\n<div class=\"wrap\">\n<div class=\"prob-grid\">\n<div class=\"prob-letter\">\n<p class=\"lead\">You didn't get into this business to learn Google Ads.<\u002Fp>\n<p>But right now, part of your budget is paying for searches that were never going to call you, and part of it is paying for people who ghost the second you quote a price.<\u002Fp>\n<p>The agency you hired to fix that sent you a PDF full of impressions and click-through rates. None of it told you whether the phone rang.<\u002Fp>\n<p>Meanwhile a competitor with a worse crew sits in the ad slot above you.<\u002Fp>\n<p class=\"dim\">Word-of-mouth got you this far. It's a result, not a system. It's what happens while you wait for one.<\u002Fp>\n<p class=\"kicker\">Here's what a system looks like instead.<\u002Fp>\n<a class=\"btn btn-accent\" href=\"#audit\">Get my free audit<\u002Fa>\n<\u002Fdiv>\n<div class=\"prob-card\">\n<h3>What you get reported<\u002Fh3>\n<p class=\"sub\">Looks busy · tells you nothing<\u002Fp>\n<ul class=\"prob-list old\">\n<li><i data-lucide=\"x\"><\u002Fi>Impressions<\u002Fli>\n<li><i data-lucide=\"x\"><\u002Fi>Click-through rate<\u002Fli>\n<li><i data-lucide=\"x\"><\u002Fi>Quality score<\u002Fli>\n<li><i data-lucide=\"x\"><\u002Fi>\"Conversions\" nobody defined<\u002Fli>\n<\u002Ful>\n<hr>\n<h3>What I report instead<\u002Fh3>\n<p class=\"sub\">The only numbers you can bank<\u002Fp>\n<ul class=\"prob-list new\">\n<li><i data-lucide=\"check\"><\u002Fi>Calls that came from an ad<\u002Fli>\n<li><i data-lucide=\"check\"><\u002Fi>Forms and WhatsApp leads<\u002Fli>\n<li><i data-lucide=\"check\"><\u002Fi>Cost per booked job<\u002Fli>\n<li><i data-lucide=\"check\"><\u002Fi>Which search caused each one<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- METHOD -->\n<section id=\"method\" class=\"b-deep\">\n<div class=\"wrap\">\n<div class=\"method-head\"><div class=\"eyebrow\">The method<\u002Fdiv><h2>The booked-job system, <em>in four steps<\u002Fem><\u002Fh2><p>Same four things, in the same order, every week. Nothing you haven't already paid an agency to skip.<\u002Fp><\u002Fdiv>\n<div class=\"method-grid\">\n<div class=\"mcard\"><div class=\"visual\"><i data-lucide=\"map-pin\"><\u002Fi><\u002Fdiv><div class=\"n\">Step 01<\u002Fdiv><h3>Structure by service and area<\u002Fh3><p>Campaigns split by exactly what you do and exactly where you drive, so budget never leaks into jobs or postcodes you don't want.<\u002Fp><\u002Fdiv>\n<div class=\"mcard\"><div class=\"visual\"><i data-lucide=\"filter\"><\u002Fi><\u002Fdiv><div class=\"n\">Step 02<\u002Fdiv><h3>Cut the searches that waste money<\u002Fh3><p>Checked every week, not once at setup. If a search doesn't turn into work, it stops costing you.<\u002Fp><\u002Fdiv>\n<div class=\"mcard\"><div class=\"visual\"><i data-lucide=\"phone-call\"><\u002Fi><\u002Fdiv><div class=\"n\">Step 03<\u002Fdiv><h3>Track every call and form<\u002Fh3><p>Calls, forms and WhatsApp messages tied back to the exact ad and search that caused them.<\u002Fp><\u002Fdiv>\n<div class=\"mcard\"><div class=\"visual\"><i data-lucide=\"calendar-check\"><\u002Fi><\u002Fdiv><div class=\"n\">Step 04<\u002Fdiv><h3>Optimize against booked jobs<\u002Fh3><p>Weekly changes based on the work you actually won, not clicks, not a score in a dashboard.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SERVICES -->\n<section id=\"services\" class=\"b-tint2\">\n<div class=\"wrap\">\n<div class=\"svc-head\">\n<h2>Most home service businesses don't have a Google Ads problem. They have a <em>wasted spending<\u002Fem> problem<\u002Fh2>\n<p>Half your budget buys clicks from people who were never going to call, and the standard report won't tell you which half.<\u002Fp>\n<\u002Fdiv>\n<div class=\"svc-main\"><div class=\"tag\">What I do<\u002Fdiv><h3>I turn Google Ads into a predictable source of booked jobs<\u002Fh3><p>For home service business owners in the US, UK and Australia. I fix what happens before and after the click, not just raise bids.<\u002Fp><\u002Fdiv>\n<div class=\"svc-diff\">\n<div class=\"dcard\"><div class=\"ic\"><i data-lucide=\"scissors\"><\u002Fi><\u002Fdiv><h4>I cut before I scale<\u002Fh4><p>Broad match, tyre-kicker keywords and the wrong service areas come out in week one. Fewer clicks, more calls.<\u002Fp><\u002Fdiv>\n<div class=\"dcard\"><div class=\"ic\"><i data-lucide=\"shield-check\"><\u002Fi><\u002Fdiv><h4>Tracking that survives an audit<\u002Fh4><p>GA4 + GTM, call tracking, form and WhatsApp events, so you can trace a booked job back to the exact keyword, not just a \"conversions\" number.<\u002Fp><\u002Fdiv>\n<div class=\"dcard\"><div class=\"ic\"><i data-lucide=\"mouse-pointer-click\"><\u002Fi><\u002Fdiv><h4>I look past the campaign<\u002Fh4><p>A well-built account pointed at a slow page with a 9-field form still loses. Landing page and lead follow-up are part of the job.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"handle\">\n<h4>What I handle<\u002Fh4>\n<p class=\"hsub\">Nine things, one person, no handoffs<\u002Fp>\n<ul>\n<li><span class=\"hi\"><i data-lucide=\"search\"><\u002Fi><\u002Fspan>Google Search Ads and call-focused campaigns<span class=\"hn\">01<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"badge-check\"><\u002Fi><\u002Fspan>Local Services Ads (LSA)<span class=\"hn\">02<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"filter\"><\u002Fi><\u002Fspan>Keyword research and negative keywords<span class=\"hn\">03<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"map-pin\"><\u002Fi><\u002Fspan>Location and service-area targeting<span class=\"hn\">04<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"clipboard-check\"><\u002Fi><\u002Fspan>Google Ads audits<span class=\"hn\">05<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"bar-chart-3\"><\u002Fi><\u002Fspan>GA4 and GTM conversion tracking<span class=\"hn\">06<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"phone-call\"><\u002Fi><\u002Fspan>Call, form and WhatsApp lead tracking<span class=\"hn\">07<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"mouse-pointer-click\"><\u002Fi><\u002Fspan>Landing page optimization<span class=\"hn\">08<\u002Fspan><\u002Fli>\n<li><span class=\"hi\"><i data-lucide=\"trending-up\"><\u002Fi><\u002Fspan>Ongoing optimization and scaling<span class=\"hn\">09<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"svc-who\">\n<div class=\"who-copy\">\n<h4>Who I work with<\u002Fh4>\n<p>Mainly the high-ticket, phone-driven trades (plumbing, HVAC, roofing, electrical and restoration) where one booked job pays for a month of clicks. Also the recurring-revenue side (pest control, cleaning, lawn care), where the number that matters is cost per new customer, not cost per job.<\u002Fp>\n<p>Alongside client work, I partner with agencies that need a Google Ads specialist behind the scenes.<\u002Fp>\n<\u002Fdiv>\n<div class=\"who-chart\" id=\"whoChart\">\n<div class=\"ct\">Relative job value<\u002Fdiv>\n<div class=\"who-seg\">\n<div class=\"sl\"><i data-lucide=\"phone-call\"><\u002Fi>High-ticket, phone-driven<\u002Fdiv>\n<div class=\"who-bars\" aria-hidden=\"true\"><i style=\"height:100%\"><\u002Fi><i style=\"height:88%\"><\u002Fi><i style=\"height:94%\"><\u002Fi><i style=\"height:76%\"><\u002Fi><i style=\"height:82%\"><\u002Fi><\u002Fdiv>\n<div class=\"who-tags\"><span>Plumbing<\u002Fspan><span>HVAC<\u002Fspan><span>Roofing<\u002Fspan><span>Electrical<\u002Fspan><span>Restoration<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"who-seg alt\">\n<div class=\"sl\"><i data-lucide=\"repeat\"><\u002Fi>Recurring revenue<\u002Fdiv>\n<div class=\"who-bars\" aria-hidden=\"true\"><i style=\"height:38%\"><\u002Fi><i style=\"height:34%\"><\u002Fi><i style=\"height:42%\"><\u002Fi><\u002Fdiv>\n<div class=\"who-tags\"><span>Pest control<\u002Fspan><span>Cleaning<\u002Fspan><span>Lawn care<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"who-note\">Illustrative: shows job value per sale, not client results.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- RESULTS -->\n<section id=\"results\" class=\"b-tint1\">\n<div class=\"wrap\">\n<div class=\"res-wrap\">\n<div class=\"res-intro\">\n<div class=\"eyebrow\">Results<\u002Fdiv>\n<h2>No case studies here <em>yet<\u002Fem>, on purpose<\u002Fh2>\n<p>I'd rather show you the exact report you'll get than dress up someone else's numbers. Here's the scorecard I fill in for every account, every month.<\u002Fp>\n<div class=\"res-note\"><i data-lucide=\"shield-check\"><\u002Fi><span>Demo numbers, shown so you can see the format. Swap in real client results before launch.<\u002Fspan><\u002Fdiv>\n<a class=\"btn btn-accent\" href=\"#audit\">Be the first case study<\u002Fa>\n<\u002Fdiv>\n<div>\n<div class=\"report\">\n<div class=\"report-top\"><h3>Monthly account scorecard<\u002Fh3><span class=\"tag\">Demo · not a real client<\u002Fspan><\u002Fdiv>\n<div class=\"report-body\">\n<div class=\"rrow hero-row\"><span class=\"k\"><b>Booked jobs from ads<\u002Fb>The only number that pays you<\u002Fspan><span class=\"v\">38 / mo<\u002Fspan><\u002Fdiv>\n<div class=\"rrow\"><span class=\"k\"><b>Cost per booked job<\u002Fb>Before → after<\u002Fspan><span class=\"v\">$214 → $131<\u002Fspan><\u002Fdiv>\n<div class=\"rrow\"><span class=\"k\"><b>Calls tracked to an ad<\u002Fb>Answered vs missed<\u002Fspan><span class=\"v\">96 · 11 missed<\u002Fspan><\u002Fdiv>\n<div class=\"rrow\"><span class=\"k\"><b>Forms &amp; WhatsApp leads<\u002Fb>Attributed to a search<\u002Fspan><span class=\"v\">43<\u002Fspan><\u002Fdiv>\n<div class=\"rrow\"><span class=\"k\"><b>Wasted spend removed<\u002Fb>Searches cut this month<\u002Fspan><span class=\"v\">$1,180<\u002Fspan><\u002Fdiv>\n<div class=\"rrow\"><span class=\"k\"><b>Industry · market · timeframe<\u002Fb>Context for the numbers<\u002Fspan><span class=\"v\">HVAC · US · 90 days<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"res-mini\">\n<div class=\"demo\"><span class=\"dtag\">Demo case 01<\u002Fspan><h4>Plumbing · UK · 6 months<\u002Fh4><div class=\"stats\"><span>−41%<i>cost per lead<\u002Fi><\u002Fspan><span>2.0×<i>booked jobs<\u002Fi><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"demo\"><span class=\"dtag\">Demo case 02<\u002Fspan><h4>Roofing · AU · 4 months<\u002Fh4><div class=\"stats\"><span>−28%<i>cost per lead<\u002Fi><\u002Fspan><span>1.6×<i>booked jobs<\u002Fi><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROCESS -->\n<section id=\"process\" class=\"b-base\">\n<div class=\"wrap\">\n<div class=\"proc-head\">\n<h2>How we start: <em>three steps<\u002Fem><\u002Fh2>\n<p>The first one is free and you keep it, whether we work together or not.<\u002Fp>\n<\u002Fdiv>\n<div class=\"proc-grid\">\n<div class=\"proc\"><div class=\"n\">01<\u002Fdiv><h3>Free audit<\u002Fh3><p>I go through your account, or your competitors' ads if you're not running any yet, and send back what's working, what's wasting money and what I'd change first.<\u002Fp><span class=\"time\"><i data-lucide=\"clock\"><\u002Fi>Back in 48 hours<\u002Fspan><\u002Fdiv>\n<div class=\"proc\"><div class=\"n\">02<\u002Fdiv><h3>Build and launch<\u002Fh3><p>Campaigns structured by service and area, tracking installed, landing pages checked before a dollar of new spend goes live.<\u002Fp><span class=\"time\"><i data-lucide=\"clock\"><\u002Fi>1–2 weeks<\u002Fspan><\u002Fdiv>\n<div class=\"proc\"><div class=\"n\">03<\u002Fdiv><h3>Weekly optimization<\u002Fh3><p>Every week I look at booked jobs, not clicks, and adjust. You get a plain-English update, not a PDF.<\u002Fp><span class=\"time\"><i data-lucide=\"clock\"><\u002Fi>Ongoing<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"proc-cta\"><a class=\"btn btn-accent\" href=\"#audit\">Start with the free audit<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTENT -->\n<section id=\"content\" class=\"b-tint1\">\n<div class=\"wrap\">\n<div class=\"blog-head\">\n<h2>Blog<\u002Fh2>\n<p>Short, specific notes on getting the phone to ring, written between accounts, not by a content team. <a href=\"Blog Index.html\" style=\"color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500\">See all posts<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<div class=\"blog-filters\" id=\"blogFilters\">\n<button class=\"on\" data-cat=\"all\">All<\u002Fbutton>\n<button data-cat=\"google-ads\">Google Ads<\u002Fbutton>\n<button data-cat=\"tracking\">Tracking<\u002Fbutton>\n<button data-cat=\"local-seo\">Local SEO<\u002Fbutton>\n<button data-cat=\"landing-pages\">Landing pages<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"blog-grid\" id=\"blogGrid\">\n<a class=\"post\" data-cat=\"tracking\" href=\"Blog Article Template.html\"><div class=\"cover\"><i data-lucide=\"phone-call\"><\u002Fi><\u002Fdiv><div class=\"meta\"><span class=\"cat\">Tracking<\u002Fspan><span class=\"pdate\">Jul 02, 2026<\u002Fspan><\u002Fdiv><h4>Why your “leads” are lying to you<\u002Fh4><p>The gap between reported leads and booked jobs, and how to close it.<\u002Fp><\u002Fa>\n<a class=\"post\" data-cat=\"google-ads\" href=\"#\"><div class=\"cover\"><i data-lucide=\"filter\"><\u002Fi><\u002Fdiv><div class=\"meta\"><span class=\"cat\">Google Ads<\u002Fspan><span class=\"pdate\">Jun 14, 2026<\u002Fspan><\u002Fdiv><h4>The searches I block on every trade account<\u002Fh4><p>They look relevant. They burn budget anyway.<\u002Fp><\u002Fa>\n<a class=\"post\" data-cat=\"landing-pages\" href=\"#\"><div class=\"cover\"><i data-lucide=\"mouse-pointer-click\"><\u002Fi><\u002Fdiv><div class=\"meta\"><span class=\"cat\">Landing pages<\u002Fspan><span class=\"pdate\">May 28, 2026<\u002Fspan><\u002Fdiv><h4>What a missed call actually costs you<\u002Fh4><p>A simple way to put a number on the tracking you don’t have yet.<\u002Fp><\u002Fa>\n<\u002Fdiv>\n<div class=\"blog-bar\">\n<div>\n<h4>One email a month<\u002Fh4>\n<p>The one thing I'd fix in a home service account this month. Nothing else.<\u002Fp>\n<\u002Fdiv>\n<form onsubmit=\"event.preventDefault()\">\n<input type=\"email\" placeholder=\"you@business.com\" aria-label=\"Email\" required=\"\">\n<button class=\"btn btn-accent\" type=\"submit\">Subscribe<\u002Fbutton>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsection>\n\n<!-- AUDIT -->\n<section id=\"audit\" class=\"b-deep\">\n<div class=\"wrap\">\n<div class=\"audit-wrap\">\n<div class=\"audit-left\">\n<p class=\"audit-eyebrow\">Free audit<\u002Fp>\n<h2>Get a <em>free<\u002Fem> Google Ads audit.<\u002Fh2>\n<p class=\"lede\">Send me your details and, if you're already running ads, view access. I'll send back a plain-English breakdown of what's working, what's wasting money and what I'd change first. If ads don't make sense for your area, I'll tell you that too.<\u002Fp>\n<dl class=\"audit-facts\">\n<div><dt>Direct email<\u002Fdt><dd>{{EMAIL}}<\u002Fdd><\u002Fdiv>\n<div><dt>Turnaround<\u002Fdt><dd>Within 48h<\u002Fdd><\u002Fdiv>\n<div><dt>WhatsApp<\u002Fdt><dd>{{WHATSAPP}}<\u002Fdd><\u002Fdiv>\n<div><dt>Timezone<\u002Fdt><dd>GMT+6 · US/UK/AU hours<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n<form class=\"audit-form\" onsubmit=\"event.preventDefault()\">\n<div class=\"fr\"><label for=\"f-name\">Your name<\u002Flabel><input id=\"f-name\" type=\"text\" placeholder=\"Sarah Khan\" required=\"\"><\u002Fdiv>\n<div class=\"fr\"><label for=\"f-email\">Email<\u002Flabel><input id=\"f-email\" type=\"email\" placeholder=\"you@business.com\" required=\"\"><\u002Fdiv>\n<div class=\"fr\"><label for=\"f-biz\">Business / website<\u002Flabel><input id=\"f-biz\" type=\"text\" placeholder=\"business.com\" required=\"\"><\u002Fdiv>\n<div class=\"fr fr-2\">\n<div><label for=\"f-area\">Service area<\u002Flabel><input id=\"f-area\" type=\"text\" placeholder=\"City or radius\" required=\"\"><\u002Fdiv>\n<div><label for=\"f-phone\">Phone / WhatsApp<\u002Flabel><input id=\"f-phone\" type=\"tel\" placeholder=\"+1 555 000 000\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"fr fr-2\">\n<div><label for=\"f-budget\">Monthly ad budget<\u002Flabel><select id=\"f-budget\"><option>Not running ads yet<\u002Foption><option>Under $1k<\u002Foption><option>$1k – $3k<\u002Foption><option>$3k – $10k<\u002Foption><option>$10k+<\u002Foption><\u002Fselect><\u002Fdiv>\n<div><label for=\"f-trade\">Trade<\u002Flabel><select id=\"f-trade\"><option>Plumbing<\u002Foption><option>HVAC<\u002Foption><option>Roofing<\u002Foption><option>Electrical<\u002Foption><option>Pest control<\u002Foption><option>Cleaning<\u002Foption><option>Landscaping<\u002Foption><option>Garage doors<\u002Foption><option>Restoration<\u002Foption><option>Other<\u002Foption><\u002Fselect><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"fr\"><label for=\"f-msg\">What's going on?<\u002Flabel><textarea id=\"f-msg\" placeholder=\"Phone not ringing, wasted spend, new location…\"><\u002Ftextarea><\u002Fdiv>\n<button class=\"btn btn-accent btn-block\" type=\"submit\">Get my free audit →<\u002Fbutton>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" class=\"b-base\">\n<div class=\"wrap\">\n<div class=\"faq-wrap\">\n<div class=\"faq-aside\">\n<div class=\"eyebrow\">FAQ<\u002Fdiv>\n<h2>Straight answers<\u002Fh2>\n<p>The questions owners actually ask me on the first call, answered the same way I'd answer them there.<\u002Fp>\n<div class=\"faq-ask\">\n<h4>Question not here?<\u002Fh4>\n<p>Ask it in the audit form. I'll answer it in the reply, whether or not we end up working together.<\u002Fp>\n<a class=\"btn btn-invert\" href=\"#audit\">Get my free audit<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"faq-groups\">\n\n<div>\n<div class=\"faq-gt\">Money &amp; commitment<\u002Fdiv>\n<div class=\"faq-list\">\n<details class=\"faq-item\"><summary>What does it cost?<\u002Fsummary><p>Management is a flat monthly fee agreed after your free audit. No percentage of spend, so my fee doesn't go up just because your budget does. You'll know the number before you commit to anything.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>What ad budget do I need?<\u002Fsummary><p>It depends on your trade and how competitive your city is. An emergency plumber in a metro pays far more per click than a lawn care company in a small town. Most home service accounts need enough spend to buy a meaningful number of clicks per week, and your free audit gives you a real number for your area instead of a guess.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>Is there a contract?<\u002Fsummary><p>No long-term contract. Month to month, cancel with 30 days' notice. If the work isn't paying for itself, you shouldn't be locked in.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>Who owns the ad account?<\u002Fsummary><p>You do. It's built in your own Google Ads account under your billing, and the tracking lives in your GA4 and GTM. If we stop working together, you keep everything, no rebuilding from zero.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>Do you guarantee a number of leads?<\u002Fsummary><p>No, and be careful with anyone who does. What I commit to is the process: tracking installed before spend, weekly optimization against booked jobs, and honest reporting, including when something isn't working.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div class=\"faq-gt\">Results &amp; timing<\u002Fdiv>\n<div class=\"faq-list\">\n<details class=\"faq-item\"><summary>How fast do I see calls?<\u002Fsummary><p>Most accounts start getting calls within the first 1–2 weeks of going live. Tracking is installed on day one, so you can watch it happen instead of waiting for a month-end report. The first 30–60 days are where cost per lead usually drops as the wasteful searches get cut.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>My last agency reported great numbers but the phone didn't ring. Why?<\u002Fsummary><p>Usually because \"conversions\" was counting the wrong things: duplicate form fills, spam submissions, 8-second calls, button clicks. I've seen an account where 60% of reported conversions were spam. The first thing I do is rebuild tracking so the number on the report is the number of real leads.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>I get a lot of tyre-kickers. Can ads fix that?<\u002Fsummary><p>Yes. That's usually a targeting and messaging problem, not a lead volume problem. Cutting price-shopper searches, tightening the service area, and being upfront on the landing page about what you do and roughly what it costs filters most of them out before they call.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>My work is seasonal. Does that break this?<\u002Fsummary><p>No. It's planned for. Budgets shift with demand: heavier in your peak months, leaner off-season with the campaigns that still convert kept running so you don't lose momentum and pay to rebuild every year.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>What about competitors clicking my ads?<\u002Fsummary><p>Google filters most invalid clicks automatically and credits them back. Beyond that, I monitor for unusual patterns and exclude the sources that look wrong. It's a real thing, but it's rarely the reason an account isn't working.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div class=\"faq-gt\">How we work together<\u002Fdiv>\n<div class=\"faq-list\">\n<details class=\"faq-item\"><summary>Do I need a website first?<\u002Fsummary><p>You need somewhere for the click to land. A full site rebuild isn't required, often a single fast, phone-first landing page with a visible number and a short form works better than an existing site. I'll tell you in the audit which one you need.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>Should I run Local Services Ads or Search Ads?<\u002Fsummary><p>Usually both, for different jobs. LSA gets you the Google Guaranteed badge at the very top and charges per lead, good for straightforward emergency work. Search Ads give you control over the specific services and areas you want. The mix depends on your trade and market.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>How do you track calls without annoying my customers?<\u002Fsummary><p>A tracking number forwards straight to your existing line, nothing changes for the caller and nothing changes for your team. It just tells me which ad and search caused the call, and how long it lasted.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>You're not in my country, how does that work?<\u002Fsummary><p>I work US, UK and Australian hours on a set schedule and respond within one business day, every day. Your account gets looked at every week regardless of where I'm sitting.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>How often will I hear from you?<\u002Fsummary><p>A short plain-English update every week, what changed, what it cost, how many booked jobs came in. Plus a call whenever you want one. No 40-page PDF nobody reads.<\u002Fp><\u002Fdetails>\n<details class=\"faq-item\"><summary>Why you instead of an agency?<\u002Fsummary><p>No account manager layer. I build, run and optimize your account myself, every week, the person on the call is the person making the changes. I also work with a limited number of clients at a time: more attention, fewer slots.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsection>\n\n\n<footer id=\"call\">\n<div class=\"wrap\">\n<div class=\"foot-top\">\n<div>\n<img class=\"foot-logo\" src=\"ea63a1e3-f9bf-4467-a13c-dfb411a61de7\" alt=\"Hire Kader\">\n<p class=\"foot-blurb\">I run Google Ads for home service businesses in the US, UK and Australia, built around booked jobs, not clicks. One person, no account managers.<\u002Fp>\n<\u002Fdiv>\n<div class=\"foot-social\">\n<a href=\"https://linkedin.com/in/abdul-kader-ppc\" target=\"_blank\" rel=\"noopener\" aria-label=\"LinkedIn\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.08 1.4-2.08 2.86V21H9z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"#call\" aria-label=\"Email\"><i data-lucide=\"mail\"><\u002Fi><\u002Fa>\n<a h
